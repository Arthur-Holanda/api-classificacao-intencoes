[pytest]
pythonpath = .
testpaths = tests
addopts = -ra --strict-markers
markers =
    unit: testes rapidos de uma unidade isolada (sem API, sem banco)
    integration: testes da API com banco em memoria (mongomock) e modelo falso
    e2e: testes de fumaca contra a API real em execucao (precisa de E2E_BASE_URL)
