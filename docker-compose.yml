name: mlops-2026-2

services:

  intent-clf:

    container_name: intent-clf
    build: 
      context: .
      dockerfile: Dockerfile
    ports:
    - "8000:8000"
    environment:
    - WANDB_API_KEY=${WANDB_API_KEY}
    - WANDB_PROJECT=${WANDB_PROJECT}
    - WANDB_MODELS=${WANDB_MODELS}
    - MONGO_URL=${MONGO_URL}
    restart: unless-stopped