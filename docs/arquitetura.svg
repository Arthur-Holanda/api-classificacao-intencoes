<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 290" width="1100" height="290" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Fluxo da API do Intent Classifier</title>
  <desc id="d">O Colab treina o modelo e o envia ao Weights &amp; Biases como artefato. A API baixa o artefato ao subir, responde as requisições POST /predictions e grava cada predição no MongoDB Atlas.</desc>
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1.5 L8.5 5 L1 8.5" fill="none" stroke="#475569" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="1099" height="289" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>

  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle" fill="#0f172a">

    <!-- Colab -->
    <rect x="25" y="150" width="180" height="90" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
    <text x="115" y="188" font-size="15" font-weight="600">Google Colab</text>
    <text x="115" y="210" font-size="12" fill="#475569">treina o IntentClassifier</text>

    <!-- W&B -->
    <rect x="315" y="150" width="180" height="90" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
    <text x="405" y="182" font-size="15" font-weight="600">Weights &amp; Biases</text>
    <text x="405" y="203" font-size="12" fill="#475569">artefato confusion-clf</text>
    <text x="405" y="220" font-size="12" fill="#475569">model.keras + config.yml</text>

    <!-- API -->
    <rect x="605" y="150" width="180" height="90" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
    <text x="695" y="188" font-size="15" font-weight="600">API (FastAPI)</text>
    <text x="695" y="210" font-size="12" fill="#475569">carrega modelos ao subir</text>

    <!-- Mongo -->
    <rect x="895" y="150" width="180" height="90" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
    <text x="985" y="188" font-size="15" font-weight="600">MongoDB Atlas</text>
    <text x="985" y="210" font-size="12" fill="#475569">coleção predictions</text>

    <!-- Cliente -->
    <rect x="605" y="25" width="180" height="60" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="695" y="51" font-size="15" font-weight="600">Swagger (/docs)</text>
    <text x="695" y="70" font-size="12" fill="#475569">ou curl</text>

    <!-- Setas horizontais -->
    <g stroke="#475569" stroke-width="1.8" fill="none">
      <line x1="209" y1="195" x2="311" y2="195" marker-end="url(#seta)"/>
      <line x1="499" y1="195" x2="601" y2="195" marker-end="url(#seta)"/>
      <line x1="789" y1="195" x2="891" y2="195" marker-end="url(#seta)"/>
      <line x1="695" y1="89" x2="695" y2="146" marker-start="url(#seta)" marker-end="url(#seta)"/>
    </g>

    <!-- Rótulos das setas -->
    <g font-size="12" fill="#0f172a">
      <text x="260" y="170">upload</text>
      <text x="260" y="185">do artefato</text>
      <text x="550" y="170">download</text>
      <text x="550" y="185">ao iniciar</text>
      <text x="840" y="170">insert_one</text>
      <text x="840" y="185">a cada POST</text>
    </g>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#64748b">
      <text x="260" y="216">WANDB_KEY</text>
      <text x="550" y="216">WANDB_MODELS</text>
      <text x="840" y="216">MONGO_URL</text>
    </g>

    <!-- Rótulo vertical -->
    <g text-anchor="start" font-size="12" fill="#0f172a">
      <text x="708" y="115">POST /predictions</text>
      <text x="708" y="131" fill="#475569">resposta JSON (200)</text>
    </g>

    <!-- Nota -->
    <text x="550" y="272" font-size="11.5" fill="#64748b">As variáveis vêm do arquivo .env (no Colab, do secret WANDB_KEY). A chave WANDB_API_KEY autoriza o download do artefato.</text>
  </g>
</svg>
